name: Deploy Test Environment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (required when build_images is false)'
        required: false
        default: ''
        type: string
      build_images:
        description: Build fresh images before deploy (recommended for recreated test envs)
        required: true
        default: true
        type: boolean
      apply_infra:
        description: Apply Terraform before deploy
        required: true
        default: true
        type: boolean
      service_filter:
        description: Comma-separated service names (empty = all)
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.filter.outputs.build_required }}
      ci_scripts_changed: ${{ steps.filter.outputs.ci_scripts_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect code/image-impacting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build_required:
              - 'apps/**'
              - 'crates/**'
              - 'schemas/**'
              - 'rules/**'
              - 'scenarios/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'infra/service-catalog.yaml'
            ci_scripts_changed:
              - 'scripts/ci/**'

  guard-rails:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_images != 'true' && needs.detect-changes.outputs.ci_scripts_changed == 'true' && needs.detect-changes.outputs.build_required != 'true' }}
    steps:
      - name: Warn when build is skipped for CI script-only change
        run: |
          echo "::warning title=Image build skipped::Only scripts/ci changed, so image build was skipped. If CI scripts now affect image contents, include those paths in detect-changes.build_required or run workflow_dispatch with build_images=true."

  guard-build-required:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_images != 'true' && github.event.inputs.image_tag == '' && needs.detect-changes.outputs.build_required == 'true' }}
    steps:
      - name: Fail when deploy skips build without explicit image tag
        run: |
          echo "::error title=Missing image tag::Image-impacting files changed, but build_images=false and image_tag is empty. Run with build_images=true or provide an explicit image_tag." >&2
          exit 1

  guard-image-source:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_images != 'true' && github.event.inputs.image_tag == '' }}
    steps:
      - name: Fail when deploy has no image source
        run: |
          echo "::error title=Missing image source::Set build_images=true or provide image_tag. Empty image_tag is not a safe default for core deploys." >&2
          exit 1

  build-images:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_images == 'true' }}
    uses: ./.github/workflows/reusable-image-build.yml
    with:
      aws_region: eu-west-1
      service_filter: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.service_filter || '' }}
      image_tag: ${{ format('sha-{0}', github.sha) }}
      push_latest: false
    secrets:
      aws_role_arn: ${{ secrets.AWS_INFRA_ROLE_ARN }}

  deploy:
    needs: [build-images, guard-build-required, guard-image-source]
    if: ${{ !cancelled() && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') && (needs.guard-build-required.result == 'success' || needs.guard-build-required.result == 'skipped') && (needs.guard-image-source.result == 'success' || needs.guard-image-source.result == 'skipped') }}
    uses: ./.github/workflows/reusable-ecs-rollout.yml
    with:
      environment: test
      image_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' && github.event.inputs.image_tag || needs.build-images.result == 'success' && format('sha-{0}', github.sha) || '' }}
      apply_infra: ${{ github.event.inputs.apply_infra == 'true' }}
      service_filter: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.service_filter || '' }}
      expected_aws_account_id: ${{ needs.build-images.result == 'success' && needs.build-images.outputs.aws_account_id || '' }}
      auto_build_missing_images: ${{ needs.build-images.result == 'success' }}
      aws_region: eu-west-1
    secrets:
      aws_role_arn: ${{ secrets.AWS_TEST_DEPLOY_ROLE_ARN }}
      infra_aws_role_arn: ${{ secrets.AWS_INFRA_ROLE_ARN }}
      tf_backend_bucket: ${{ secrets.TF_BACKEND_BUCKET }}
      tf_backend_dynamodb_table: ${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}
      tf_backend_kms_key_id: ${{ secrets.TF_BACKEND_KMS_KEY_ID }}
