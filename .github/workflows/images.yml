name: Build and Push Core Images

# Deployments and image publication are manual-only.
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: AWS account/environment to push images into
        required: true
        default: test
        type: choice
        options:
          - test
          - stage
          - prod
      service_filter:
        description: Comma-separated service names to build (empty = all)
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-image-build.yml
    with:
      environment: ${{ inputs.target_environment }}
      aws_region: eu-west-1
      service_filter: ${{ github.event.inputs.service_filter || '' }}
      image_tag: ${{ format('sha-{0}', github.sha) }}
      push_latest: false
    secrets:
      aws_role_arn: ${{ inputs.target_environment == 'prod' && (secrets.AWS_IMAGES_ROLE_ARN_PROD != '' && secrets.AWS_IMAGES_ROLE_ARN_PROD || secrets.AWS_IMAGES_ROLE_ARN) || inputs.target_environment == 'stage' && (secrets.AWS_IMAGES_ROLE_ARN_STAGE != '' && secrets.AWS_IMAGES_ROLE_ARN_STAGE || secrets.AWS_IMAGES_ROLE_ARN) || (secrets.AWS_IMAGES_ROLE_ARN_TEST != '' && secrets.AWS_IMAGES_ROLE_ARN_TEST || secrets.AWS_IMAGES_ROLE_ARN != '' && secrets.AWS_IMAGES_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN) }}
