name: Terraform Plan

on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-plan.yml'
      - '.github/workflows/reusable-terraform-plan.yml'
      - 'scripts/ci/**'
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to plan
        required: true
        default: test
        type: choice
        options:
          - test
          - stage
          - prod
      image_tag:
        description: Image tag override used for plan
        required: false
        default: latest
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.target_environment) || '["test","stage","prod"]') }}

    uses: ./.github/workflows/reusable-terraform-plan.yml
    with:
      environment: ${{ matrix.environment }}
      image_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || format('sha-{0}', github.sha) }}
      aws_region: eu-west-1
    secrets:
      aws_role_arn: ${{ matrix.environment == 'prod' && (secrets.AWS_PROD_INFRA_ROLE_ARN != '' && secrets.AWS_PROD_INFRA_ROLE_ARN || secrets.AWS_PROD_DEPLOY_ROLE_ARN != '' && secrets.AWS_PROD_DEPLOY_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN) || matrix.environment == 'stage' && (secrets.AWS_STAGE_INFRA_ROLE_ARN != '' && secrets.AWS_STAGE_INFRA_ROLE_ARN || secrets.AWS_STAGE_DEPLOY_ROLE_ARN != '' && secrets.AWS_STAGE_DEPLOY_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN) || (secrets.AWS_TEST_INFRA_ROLE_ARN != '' && secrets.AWS_TEST_INFRA_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN) }}
      tf_backend_bucket: ${{ matrix.environment == 'prod' && (secrets.TF_BACKEND_BUCKET_PROD != '' && secrets.TF_BACKEND_BUCKET_PROD || secrets.TF_BACKEND_BUCKET) || matrix.environment == 'stage' && (secrets.TF_BACKEND_BUCKET_STAGE != '' && secrets.TF_BACKEND_BUCKET_STAGE || secrets.TF_BACKEND_BUCKET) || (secrets.TF_BACKEND_BUCKET_TEST != '' && secrets.TF_BACKEND_BUCKET_TEST || secrets.TF_BACKEND_BUCKET) }}
      tf_backend_dynamodb_table: ${{ matrix.environment == 'prod' && (secrets.TF_BACKEND_DYNAMODB_TABLE_PROD != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_PROD || secrets.TF_BACKEND_DYNAMODB_TABLE) || matrix.environment == 'stage' && (secrets.TF_BACKEND_DYNAMODB_TABLE_STAGE != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_STAGE || secrets.TF_BACKEND_DYNAMODB_TABLE) || (secrets.TF_BACKEND_DYNAMODB_TABLE_TEST != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_TEST || secrets.TF_BACKEND_DYNAMODB_TABLE) }}
      tf_backend_kms_key_id: ${{ matrix.environment == 'prod' && (secrets.TF_BACKEND_KMS_KEY_ID_PROD != '' && secrets.TF_BACKEND_KMS_KEY_ID_PROD || secrets.TF_BACKEND_KMS_KEY_ID) || matrix.environment == 'stage' && (secrets.TF_BACKEND_KMS_KEY_ID_STAGE != '' && secrets.TF_BACKEND_KMS_KEY_ID_STAGE || secrets.TF_BACKEND_KMS_KEY_ID) || (secrets.TF_BACKEND_KMS_KEY_ID_TEST != '' && secrets.TF_BACKEND_KMS_KEY_ID_TEST || secrets.TF_BACKEND_KMS_KEY_ID) }}
      public_certificate_arn: ${{ matrix.environment == 'prod' && (secrets.PUBLIC_CERTIFICATE_ARN_PROD != '' && secrets.PUBLIC_CERTIFICATE_ARN_PROD || secrets.PUBLIC_CERTIFICATE_ARN) || matrix.environment == 'stage' && (secrets.PUBLIC_CERTIFICATE_ARN_STAGE != '' && secrets.PUBLIC_CERTIFICATE_ARN_STAGE || secrets.PUBLIC_CERTIFICATE_ARN) || (secrets.PUBLIC_CERTIFICATE_ARN_TEST != '' && secrets.PUBLIC_CERTIFICATE_ARN_TEST || secrets.PUBLIC_CERTIFICATE_ARN) }}
