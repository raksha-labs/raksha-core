name: Destroy Shared Environment (Zero Cost)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - test
          - stage
          - prod
        default: test
      confirmation:
        description: "Type exactly: DESTROY-<environment> (example: DESTROY-test)"
        required: true
        type: string
      purge_ecr_images:
        description: "Delete ECR images before destroy when possible (recommended)"
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy-environment:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout raksha-core
        uses: actions/checkout@v4

      - name: Validate cross-repo checkout token
        env:
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CROSS_REPO_READ_TOKEN}" ]; then
            echo "Secret CROSS_REPO_READ_TOKEN is required for Destroy Shared Environment." >&2
            echo "The workflow must read private repos raksha-labs/raksha-platform and raksha-labs/raksha-simlab." >&2
            echo "The default GITHUB_TOKEN from raksha-core cannot read those repositories." >&2
            exit 1
          fi

      - name: Checkout raksha-platform
        uses: actions/checkout@v4
        with:
          repository: raksha-labs/raksha-platform
          path: raksha-platform
          ref: master
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Checkout raksha-simlab
        uses: actions/checkout@v4
        with:
          repository: raksha-labs/raksha-simlab
          path: raksha-simlab
          ref: master
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Validate confirmation input
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          expected="DESTROY-${ENVIRONMENT}"

          if [ "${CONFIRMATION}" != "${expected}" ]; then
            echo "Invalid confirmation. Expected: ${expected}" >&2
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials for raksha-platform destroy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && (secrets.AWS_PROD_INFRA_ROLE_ARN != '' && secrets.AWS_PROD_INFRA_ROLE_ARN || secrets.AWS_PROD_DEPLOY_ROLE_ARN) || inputs.environment == 'stage' && (secrets.AWS_STAGE_INFRA_ROLE_ARN != '' && secrets.AWS_STAGE_INFRA_ROLE_ARN || secrets.AWS_STAGE_DEPLOY_ROLE_ARN) || (secrets.AWS_TEST_INFRA_ROLE_ARN != '' && secrets.AWS_TEST_INFRA_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN != '' && secrets.AWS_INFRA_ROLE_ARN || secrets.AWS_TEST_DEPLOY_ROLE_ARN) }}
          aws-region: eu-west-1

      - name: Purge raksha-platform ECR images (optional)
        if: ${{ inputs.purge_ecr_images == true }}
        working-directory: raksha-platform
        run: |
          set -euo pipefail
          echo "Purging platform ECR images to allow repository deletion..."

          while IFS= read -r repo; do
            [ -n "${repo}" ] || continue

            if ! aws ecr describe-repositories --repository-names "${repo}" --region "eu-west-1" >/dev/null 2>&1; then
              echo "Skipping missing repository: ${repo}"
              continue
            fi

            images_json="$(aws ecr list-images --repository-name "${repo}" --region "eu-west-1" --query 'imageIds[*]' --output json)"
            if [ "${images_json}" = "[]" ]; then
              echo "No images to purge in ${repo}"
              continue
            fi

            aws ecr batch-delete-image --repository-name "${repo}" --region "eu-west-1" --image-ids "${images_json}" >/dev/null
            echo "Purged images from ${repo}"
          done < <(awk -F': ' '/image_repo:/{gsub(/"/,"",$2); print $2}' infra/service-catalog.yaml | sort -u)

      - name: Destroy raksha-platform
        working-directory: raksha-platform
        env:
          AWS_REGION: eu-west-1
          TF_BACKEND_BUCKET: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_BUCKET_PROD != '' && secrets.TF_BACKEND_BUCKET_PROD || secrets.TF_BACKEND_BUCKET) || inputs.environment == 'stage' && (secrets.TF_BACKEND_BUCKET_STAGE != '' && secrets.TF_BACKEND_BUCKET_STAGE || secrets.TF_BACKEND_BUCKET) || (secrets.TF_BACKEND_BUCKET_TEST != '' && secrets.TF_BACKEND_BUCKET_TEST || secrets.TF_BACKEND_BUCKET) }}
          TF_BACKEND_DYNAMODB_TABLE: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_DYNAMODB_TABLE_PROD != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_PROD || secrets.TF_BACKEND_DYNAMODB_TABLE) || inputs.environment == 'stage' && (secrets.TF_BACKEND_DYNAMODB_TABLE_STAGE != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_STAGE || secrets.TF_BACKEND_DYNAMODB_TABLE) || (secrets.TF_BACKEND_DYNAMODB_TABLE_TEST != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_TEST || secrets.TF_BACKEND_DYNAMODB_TABLE) }}
          TF_BACKEND_KMS_KEY_ID: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_KMS_KEY_ID_PROD != '' && secrets.TF_BACKEND_KMS_KEY_ID_PROD || secrets.TF_BACKEND_KMS_KEY_ID) || inputs.environment == 'stage' && (secrets.TF_BACKEND_KMS_KEY_ID_STAGE != '' && secrets.TF_BACKEND_KMS_KEY_ID_STAGE || secrets.TF_BACKEND_KMS_KEY_ID) || (secrets.TF_BACKEND_KMS_KEY_ID_TEST != '' && secrets.TF_BACKEND_KMS_KEY_ID_TEST || secrets.TF_BACKEND_KMS_KEY_ID) }}
        run: |
          scripts/ci/terraform_destroy.sh "${{ inputs.environment }}" "destroy-${{ github.run_id }}"

      - name: Configure AWS credentials for raksha-simlab destroy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && (secrets.AWS_PROD_INFRA_ROLE_ARN != '' && secrets.AWS_PROD_INFRA_ROLE_ARN || secrets.AWS_PROD_DEPLOY_ROLE_ARN) || inputs.environment == 'stage' && (secrets.AWS_STAGE_INFRA_ROLE_ARN != '' && secrets.AWS_STAGE_INFRA_ROLE_ARN || secrets.AWS_STAGE_DEPLOY_ROLE_ARN) || (secrets.AWS_TEST_INFRA_ROLE_ARN != '' && secrets.AWS_TEST_INFRA_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN != '' && secrets.AWS_INFRA_ROLE_ARN || secrets.AWS_TEST_DEPLOY_ROLE_ARN) }}
          aws-region: eu-west-1

      - name: Purge raksha-simlab ECR images (optional)
        if: ${{ inputs.purge_ecr_images == true }}
        working-directory: raksha-simlab
        run: |
          set -euo pipefail
          echo "Purging simlab ECR images to allow repository deletion..."

          while IFS= read -r repo; do
            [ -n "${repo}" ] || continue

            if ! aws ecr describe-repositories --repository-names "${repo}" --region "eu-west-1" >/dev/null 2>&1; then
              echo "Skipping missing repository: ${repo}"
              continue
            fi

            images_json="$(aws ecr list-images --repository-name "${repo}" --region "eu-west-1" --query 'imageIds[*]' --output json)"
            if [ "${images_json}" = "[]" ]; then
              echo "No images to purge in ${repo}"
              continue
            fi

            aws ecr batch-delete-image --repository-name "${repo}" --region "eu-west-1" --image-ids "${images_json}" >/dev/null
            echo "Purged images from ${repo}"
          done < <(awk -F': ' '/image_repo:/{gsub(/"/,"",$2); print $2}' infra/service-catalog.yaml | sort -u)

      - name: Destroy raksha-simlab
        working-directory: raksha-simlab
        env:
          AWS_REGION: eu-west-1
          TF_BACKEND_BUCKET: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_BUCKET_PROD != '' && secrets.TF_BACKEND_BUCKET_PROD || secrets.TF_BACKEND_BUCKET) || inputs.environment == 'stage' && (secrets.TF_BACKEND_BUCKET_STAGE != '' && secrets.TF_BACKEND_BUCKET_STAGE || secrets.TF_BACKEND_BUCKET) || (secrets.TF_BACKEND_BUCKET_TEST != '' && secrets.TF_BACKEND_BUCKET_TEST || secrets.TF_BACKEND_BUCKET) }}
          TF_BACKEND_DYNAMODB_TABLE: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_DYNAMODB_TABLE_PROD != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_PROD || secrets.TF_BACKEND_DYNAMODB_TABLE) || inputs.environment == 'stage' && (secrets.TF_BACKEND_DYNAMODB_TABLE_STAGE != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_STAGE || secrets.TF_BACKEND_DYNAMODB_TABLE) || (secrets.TF_BACKEND_DYNAMODB_TABLE_TEST != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_TEST || secrets.TF_BACKEND_DYNAMODB_TABLE) }}
          TF_BACKEND_KMS_KEY_ID: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_KMS_KEY_ID_PROD != '' && secrets.TF_BACKEND_KMS_KEY_ID_PROD || secrets.TF_BACKEND_KMS_KEY_ID) || inputs.environment == 'stage' && (secrets.TF_BACKEND_KMS_KEY_ID_STAGE != '' && secrets.TF_BACKEND_KMS_KEY_ID_STAGE || secrets.TF_BACKEND_KMS_KEY_ID) || (secrets.TF_BACKEND_KMS_KEY_ID_TEST != '' && secrets.TF_BACKEND_KMS_KEY_ID_TEST || secrets.TF_BACKEND_KMS_KEY_ID) }}
        run: |
          scripts/ci/terraform_destroy.sh "${{ inputs.environment }}" "destroy-${{ github.run_id }}"

      - name: Configure AWS credentials for raksha-core destroy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && (secrets.AWS_PROD_INFRA_ROLE_ARN != '' && secrets.AWS_PROD_INFRA_ROLE_ARN || secrets.AWS_PROD_DEPLOY_ROLE_ARN) || inputs.environment == 'stage' && (secrets.AWS_STAGE_INFRA_ROLE_ARN != '' && secrets.AWS_STAGE_INFRA_ROLE_ARN || secrets.AWS_STAGE_DEPLOY_ROLE_ARN) || (secrets.AWS_TEST_INFRA_ROLE_ARN != '' && secrets.AWS_TEST_INFRA_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN != '' && secrets.AWS_INFRA_ROLE_ARN || secrets.AWS_TEST_DEPLOY_ROLE_ARN) }}
          aws-region: eu-west-1

      - name: Purge raksha-core ECR images (optional)
        if: ${{ inputs.purge_ecr_images == true }}
        run: |
          set -euo pipefail
          echo "Purging core ECR images to allow repository deletion..."

          while IFS= read -r repo; do
            [ -n "${repo}" ] || continue

            if ! aws ecr describe-repositories --repository-names "${repo}" --region "eu-west-1" >/dev/null 2>&1; then
              echo "Skipping missing repository: ${repo}"
              continue
            fi

            images_json="$(aws ecr list-images --repository-name "${repo}" --region "eu-west-1" --query 'imageIds[*]' --output json)"
            if [ "${images_json}" = "[]" ]; then
              echo "No images to purge in ${repo}"
              continue
            fi

            aws ecr batch-delete-image --repository-name "${repo}" --region "eu-west-1" --image-ids "${images_json}" >/dev/null
            echo "Purged images from ${repo}"
          done < <(awk -F': ' '/image_repo:/{gsub(/"/,"",$2); print $2}' infra/service-catalog.yaml | sort -u)

      - name: Destroy raksha-core
        env:
          AWS_REGION: eu-west-1
          TF_BACKEND_BUCKET: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_BUCKET_PROD != '' && secrets.TF_BACKEND_BUCKET_PROD || secrets.TF_BACKEND_BUCKET) || inputs.environment == 'stage' && (secrets.TF_BACKEND_BUCKET_STAGE != '' && secrets.TF_BACKEND_BUCKET_STAGE || secrets.TF_BACKEND_BUCKET) || (secrets.TF_BACKEND_BUCKET_TEST != '' && secrets.TF_BACKEND_BUCKET_TEST || secrets.TF_BACKEND_BUCKET) }}
          TF_BACKEND_DYNAMODB_TABLE: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_DYNAMODB_TABLE_PROD != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_PROD || secrets.TF_BACKEND_DYNAMODB_TABLE) || inputs.environment == 'stage' && (secrets.TF_BACKEND_DYNAMODB_TABLE_STAGE != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_STAGE || secrets.TF_BACKEND_DYNAMODB_TABLE) || (secrets.TF_BACKEND_DYNAMODB_TABLE_TEST != '' && secrets.TF_BACKEND_DYNAMODB_TABLE_TEST || secrets.TF_BACKEND_DYNAMODB_TABLE) }}
          TF_BACKEND_KMS_KEY_ID: ${{ inputs.environment == 'prod' && (secrets.TF_BACKEND_KMS_KEY_ID_PROD != '' && secrets.TF_BACKEND_KMS_KEY_ID_PROD || secrets.TF_BACKEND_KMS_KEY_ID) || inputs.environment == 'stage' && (secrets.TF_BACKEND_KMS_KEY_ID_STAGE != '' && secrets.TF_BACKEND_KMS_KEY_ID_STAGE || secrets.TF_BACKEND_KMS_KEY_ID) || (secrets.TF_BACKEND_KMS_KEY_ID_TEST != '' && secrets.TF_BACKEND_KMS_KEY_ID_TEST || secrets.TF_BACKEND_KMS_KEY_ID) }}
        run: |
          scripts/ci/terraform_destroy.sh "${{ inputs.environment }}" "destroy-${{ github.run_id }}"

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Shared Environment Destroy

          - Environment: ${{ inputs.environment }}
          - raksha-platform: destroy attempted
          - raksha-simlab: destroy attempted
          - raksha-core: destroy attempted
          - ECR purge requested: ${{ inputs.purge_ecr_images }}
          - Triggered by: ${{ github.actor }}
          - Workflow run: ${{ github.run_id }}

          This workflow is intended to drive the environment to zero cost by destroying
          platform, simlab, and then core-managed shared resources in order.
          Shared resources include the VPC, NAT, ECS, ALBs, Redis, RDS, and other
          Terraform-managed infrastructure owned by the three repos.
          EOF
