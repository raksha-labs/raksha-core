name: Reusable Image Build

on:
  workflow_call:
    inputs:
      aws_region:
        required: false
        type: string
        default: eu-west-1
      service_filter:
        required: false
        type: string
        default: ''
      image_tag:
        required: false
        type: string
        default: ''
      push_latest:
        required: false
        type: boolean
        default: false
    secrets:
      aws_role_arn:
        required: true
    outputs:
      aws_account_id:
        description: AWS account used for image build and push
        value: ${{ jobs.build.outputs.aws_account_id }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      aws_account_id: ${{ steps.resolve-account.outputs.aws_account_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve AWS account for image build
        id: resolve-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "aws_account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "[ci] image build account=${ACCOUNT_ID}"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          SERVICE_FILTER: ${{ inputs.service_filter }}
          IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || format('sha-{0}', github.sha) }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          SKIP_DOCKER_LOGIN: 'true'
        run: |
          scripts/ci/build_push_images.sh
